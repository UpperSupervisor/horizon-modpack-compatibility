# Java mods that Horizon already does on its own.
#
# Hopper checks this table first. Every row is reviewed by hand and links the
# Horizon page that backs it. Change it with a pull request that quotes the doc.
#
#   mods    Java mod ids, as in fabric.mod.json or mods.toml (lowercase, "-" as "_")
#   words   optional: words in a mod's name that mark a whole family of mods
#   horizon what Horizon calls its own version
#   kind    engine (nothing to turn on), setting (off by default, one switch)
#           or official-mod (installs from the launcher's Mods page)
#   how     one plain sentence, shown under "How to turn it on"
#   source  the Horizon doc that says so

[[builtin]]
mods = ["sodium", "lithium", "ferritecore", "modernfix", "immediatelyfast"]
horizon = "Horizon's engine"
kind = "engine"
how = "Nothing to turn on. Horizon is already this fast."
source = "https://github.com/horizon-rust/horizon/blob/main/docs/modpacks.md"

[[builtin]]
mods = ["distanthorizons"]
horizon = "LOD Distance"
kind = "setting"
how = "Open Options, then Horizon Settings, then Graphics, and raise LOD Distance. It goes up to 1024 chunks."
source = "https://github.com/horizon-rust/horizon#what-works-today"

[[builtin]]
mods = ["xaerominimap", "xaerominimapfair", "journeymap"]
horizon = "Minimap"
kind = "official-mod"
how = "Open the Horizon launcher, go to Mods and install Minimap."
source = "https://github.com/horizon-rust/horizon/blob/main/docs/mods.md#horizons-official-mods"

